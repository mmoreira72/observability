server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: "http://loki:3100/loki/api/v1/push"

scrape_configs:
  - job_name: "local-apache-logs"
    static_configs:
      - targets:
          - localhost
        labels:
          job: "apache"
          service_name: "apache_access"
          instance: "local"
          __path__: "/var/log/apache2/*access*.log"

scrape_configs:
  - job_name: "local-apache-error-logs"
    static_configs:
      - targets:
          - localhost
        labels:
          job: "apache_error"
          service_name: "apache_error"
          instance: "local"
          __path__: "/var/log/apache2/*error*.log"